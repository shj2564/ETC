name: Build SoNG Browser Optimizer

on:
  push:
    paths:
      - 'BrowserOptimizer/**'
      - '.github/workflows/build-browser-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win11:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone Windows EXE
        shell: pwsh
        run: ./BrowserOptimizer/build.ps1

      - name: Safe read-only smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe'
          $out = Join-Path $env:RUNNER_TEMP 'browser_optimizer_selftest.txt'
          & $exe ("/selftest=" + $out)
          if (!(Test-Path $out)) { throw 'Self-test did not produce output' }
          $result = Get-Content -Path $out -Raw
          Write-Host $result
          if ($result -notmatch 'SELFTEST=OK') { throw 'Self-test failed' }
          if ($result -notmatch 'NoProcessTrimmed=True') { throw 'Self-test unexpectedly trimmed a process' }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SoNG_Browser_Optimizer_Windows
          path: BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe
          if-no-files-found: error
          retention-days: 30
