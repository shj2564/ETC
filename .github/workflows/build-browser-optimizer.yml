name: Build SoNG Browser Optimizer

on:
  push:
    paths:
      - 'BrowserOptimizer/**'
      - '.github/workflows/build-browser-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win11:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone Windows EXE
        shell: pwsh
        run: ./BrowserOptimizer/build.ps1

      - name: Safe read-only smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe'
          $out = Join-Path $env:RUNNER_TEMP 'browser_optimizer_selftest.txt'
          $process = Start-Process -FilePath $exe -ArgumentList ("/selftest=" + $out) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Self-test exited with code $($process.ExitCode)" }
          if (!(Test-Path $out)) { throw 'Self-test did not produce output' }
          $result = Get-Content -Path $out -Raw
          Write-Host $result
          if ($result -notmatch 'SELFTEST=OK') { throw 'Self-test failed' }
          if ($result -notmatch 'NoProcessTrimmed=True') { throw 'Self-test unexpectedly trimmed a process' }

      - name: Verify hidden tray launch (no window)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--tray' -PassThru
          try {
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "Tray process exited unexpectedly with $($process.ExitCode)" }
            if ($process.MainWindowHandle -ne [IntPtr]::Zero) { throw 'Tray mode unexpectedly created a visible main window' }
            Write-Host "TRAY_BOOT=OK; ProcessAlive=True; MainWindowHandle=0"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SoNG_Browser_Optimizer_Windows
          path: BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish icon-enhanced EXE to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BrowserOptimizer/dist/SoNG_Browser_Optimizer.exe BrowserOptimizer/assets/SoNG_Browser_Optimizer.ico
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'build: publish SoNG Browser Optimizer v1.2 tray startup [skip ci]'
            git push origin HEAD:main
          }
